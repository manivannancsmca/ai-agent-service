spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-dev-key}
  datasource:
    url: jdbc:mysql://localhost:3306/ai_agent_db?useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update  # Auto-create schema in dev
    show-sql: true

logging:
  level:
    com.enterprise.aiagent: DEBUG
    org.springframework.ai: DEBUG
    org.hibernate.SQL: DEBUG

# Use smaller token budget in dev to save costs
ai:
  agent:
    token-budget:
      max-per-conversation: 50000
      max-per-request: 4000