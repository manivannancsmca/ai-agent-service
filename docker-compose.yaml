# docker-compose.yml (at repository root)
version: '3.8'

services:

  # ═══════════════════════════════════════════════════
  #  DATABASES (one per service — database per service pattern)
  # ═══════════════════════════════════════════════════
  mysql-product:
    image: mysql:8.0
    container_name: mysql-product
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: product_db
      MYSQL_USER: svc_user
      MYSQL_PASSWORD: svc_password
    ports:
      - "3311:3306"
    volumes:
      - product_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices

  mysql-order:
    image: mysql:8.0
    container_name: mysql-order
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: order_db
      MYSQL_USER: svc_user
      MYSQL_PASSWORD: svc_password
    ports:
      - "3312:3306"
    volumes:
      - order_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices

  mysql-inventory:
    image: mysql:8.0
    container_name: mysql-inventory
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inventory_db
      MYSQL_USER: svc_user
      MYSQL_PASSWORD: svc_password
    ports:
      - "3313:3306"
    volumes:
      - inventory_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices

  mysql-payment:
    image: mysql:8.0
    container_name: mysql-payment
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: payment_db
      MYSQL_USER: svc_user
      MYSQL_PASSWORD: svc_password
    ports:
      - "3314:3306"
    volumes:
      - payment_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices

  mysql-agent:
    image: mysql:8.0
    container_name: mysql-agent
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ai_agent_db
      MYSQL_USER: svc_user
      MYSQL_PASSWORD: svc_password
    ports:
      - "3315:3306"
    volumes:
      - agent_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices

  # ═══════════════════════════════════════════════════
  #  MICROSERVICES
  # ═══════════════════════════════════════════════════

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: mysql-product
      DB_PORT: 3306
      DB_NAME: product_db
      DB_USERNAME: svc_user
      DB_PASSWORD: svc_password
    depends_on:
      mysql-product:
        condition: service_healthy
    networks:
      - microservices
    restart: unless-stopped

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: mysql-order
      DB_PORT: 3306
      DB_NAME: order_db
      DB_USERNAME: svc_user
      DB_PASSWORD: svc_password
    depends_on:
      mysql-order:
        condition: service_healthy
    networks:
      - microservices
    restart: unless-stopped

  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    container_name: inventory-service
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: mysql-inventory
      DB_PORT: 3306
      DB_NAME: inventory_db
      DB_USERNAME: svc_user
      DB_PASSWORD: svc_password
    depends_on:
      mysql-inventory:
        condition: service_healthy
    networks:
      - microservices
    restart: unless-stopped

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: mysql-payment
      DB_PORT: 3306
      DB_NAME: payment_db
      DB_USERNAME: svc_user
      DB_PASSWORD: svc_password
    depends_on:
      mysql-payment:
        condition: service_healthy
    networks:
      - microservices
    restart: unless-stopped

  # ═══════════════════════════════════════════════════
  #  AI AGENT SERVICE (the orchestrator)
  # ═══════════════════════════════════════════════════

  ai-agent-service:
    build:
      context: ./ai-agent-service
      dockerfile: Dockerfile
    container_name: ai-agent-service
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DB_HOST: mysql-agent
      DB_PORT: 3306
      DB_NAME: ai_agent_db
      DB_USERNAME: svc_user
      DB_PASSWORD: svc_password
      PRODUCT_SERVICE_URL: http://product-service:8081
      ORDER_SERVICE_URL: http://order-service:8082
      INVENTORY_SERVICE_URL: http://inventory-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8084
    depends_on:
      mysql-agent:
        condition: service_healthy
      product-service:
        condition: service_started
      order-service:
        condition: service_started
      inventory-service:
        condition: service_started
      payment-service:
        condition: service_started
    networks:
      - microservices
    restart: unless-stopped

  # ═══════════════════════════════════════════════════
  #  MONITORING
  # ═══════════════════════════════════════════════════

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - microservices

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    networks:
      - microservices

volumes:
  product_data:
  order_data:
  inventory_data:
  payment_data:
  agent_data:
  ai_agent_data:

networks:
  microservices:
    driver: bridge